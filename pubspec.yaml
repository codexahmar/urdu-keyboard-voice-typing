name: urdu_keyboard
description: "Urdu Smart Keyboard - A simple, ad-free keyboard app for Urdu typing"
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Local storage
  shared_preferences: ^2.2.2

  # Permissions
  permission_handler: ^11.3.0

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/icons/


